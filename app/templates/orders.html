{% extends "base.html" %}
{% block title %}Pedidos{% endblock %}
{% block content %}
<h1 class="page-title">Mis pedidos</h1>
<p class="muted">Pedidos asociados a su cuenta.</p>

<table class="table">
  <thead><tr><th>#</th><th>Estado</th><th>Total</th><th>Notas</th><th>Fecha</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="6" class="muted">Cargando…</td></tr></tbody>
</table>
{% endblock %}

{% block scripts %}
<script>
(async function () {
  const r = await api("/api/orders");
  const tb = document.getElementById("rows");
  const orders = r.ok ? r.data : [];
  if (!orders.length) { tb.innerHTML = '<tr><td colspan="6" class="muted">Sin pedidos.</td></tr>'; return; }
  tb.innerHTML = orders.map(o => `
    <tr>
      <td>#${o.id}</td>
      <td>${statusTag(o.status)}</td>
      <td>${money(o.total)}</td>
      <td>${esc(o.notes)}</td>
      <td>${esc(o.created_at)}</td>
      <td><a class="link" href="/orders/${o.id}">Ver detalle</a></td>
    </tr>`).join("");
})();
</script>
{% endblock %}
