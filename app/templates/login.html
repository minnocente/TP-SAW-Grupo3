{% extends "base.html" %}
{% block title %}Ingreso{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><span class="logo">◆</span> OrderFlow</div>
    <p class="login-sub">Acceso al portal de clientes</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('web.login', next=request.args.get('next','')) }}">
      <label>Usuario
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
